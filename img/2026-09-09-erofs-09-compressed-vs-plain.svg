<text text-anchor="middle" x="585" y="-305.8" font-family="Droid Sans Fallback" font-size="9.00">③ 和 ⑤ 是非压缩路径</text>
<text text-anchor="middle" x="585" y="-295.8" font-family="Droid Sans Fallback" font-size="9.00">完全不存在的两步：</text>
<text text-anchor="middle" x="585" y="-275.8" font-family="Droid Sans Fallback" font-size="9.00">③ 协调：同一个 pcluster</text>
<text text-anchor="middle" x="585" y="-265.8" font-family="Droid Sans Fallback" font-size="9.00"> &#160;可能被多个并发读请求需要，</text>
<text text-anchor="middle" x="585" y="-255.8" font-family="Droid Sans Fallback" font-size="9.00"> &#160;不能各解各的（浪费 CPU），</text>
<text text-anchor="middle" x="585" y="-245.8" font-family="Droid Sans Fallback" font-size="9.00"> &#160;所以要有排队/引用机制</text>
<text text-anchor="middle" x="585" y="-225.8" font-family="Droid Sans Fallback" font-size="9.00">⑤ 解压：读到的数据是压缩的，</text>
<text text-anchor="middle" x="585" y="-215.8" font-family="Droid Sans Fallback" font-size="9.00"> &#160;要解压，还要决定</text>
<text text-anchor="middle" x="585" y="-205.8" font-family="Droid Sans Fallback" font-size="9.00"> &#160;解压到哪块内存</text>
<text text-anchor="middle" x="585" y="-185.8" font-family="Droid Sans Fallback" font-size="9.00">这两步就是阶段 4 的主战场。</text>
</g>
