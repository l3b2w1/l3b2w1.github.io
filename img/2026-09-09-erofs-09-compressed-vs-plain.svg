<!-- why -->
<g id="node10" class="node">
<title>why</title>
<polygon fill="#fff2cc" stroke="black" points="463.5,-316.5 339.5,-316.5 339.5,-95.5 469.5,-95.5 469.5,-310.5 463.5,-316.5"/>
<polyline fill="none" stroke="black" points="463.5,-316.5 463.5,-310.5 "/>
<polyline fill="none" stroke="black" points="469.5,-310.5 463.5,-310.5 "/>
<text text-anchor="middle" x="404.5" y="-304.5" font-family="Droid Sans Fallback" font-size="10.00">为什么压缩不能「算」？</text>
<text text-anchor="middle" x="404.5" y="-281.5" font-family="Droid Sans Fallback" font-size="10.00">非压缩：</text>
<text text-anchor="middle" x="404.5" y="-270.5" font-family="Droid Sans Fallback" font-size="10.00"> &#160;逻辑 8KB → 磁盘 8KB</text>
<text text-anchor="middle" x="404.5" y="-259.5" font-family="Droid Sans Fallback" font-size="10.00"> &#160;一一对应，除法即可</text>
<text text-anchor="middle" x="404.5" y="-236.5" font-family="Droid Sans Fallback" font-size="10.00">压缩：</text>
<text text-anchor="middle" x="404.5" y="-225.5" font-family="Droid Sans Fallback" font-size="10.00"> &#160;逻辑 8KB → 磁盘 ???</text>
<text text-anchor="middle" x="404.5" y="-214.5" font-family="Droid Sans Fallback" font-size="10.00"> &#160;压缩后多长，取决于内容</text>
<text text-anchor="middle" x="404.5" y="-191.5" font-family="Droid Sans Fallback" font-size="10.00">举个极端例子</text>
<text text-anchor="middle" x="404.5" y="-180.5" font-family="Droid Sans Fallback" font-size="10.00">（阶段 1 的实测）：</text>
<text text-anchor="middle" x="404.5" y="-169.5" font-family="Droid Sans Fallback" font-size="10.00"> &#160;400000 字节 → 4096 字节</text>
<text text-anchor="middle" x="404.5" y="-158.5" font-family="Droid Sans Fallback" font-size="10.00"> &#160;整整 98 倍差</text>
<text text-anchor="middle" x="404.5" y="-135.5" font-family="Droid Sans Fallback" font-size="10.00">所以必须有一张表</text>
<text text-anchor="middle" x="404.5" y="-124.5" font-family="Droid Sans Fallback" font-size="10.00">记录「哪个逻辑范围</text>
<text text-anchor="middle" x="404.5" y="-113.5" font-family="Droid Sans Fallback" font-size="10.00">对应哪个物理位置」——</text>
<text text-anchor="middle" x="404.5" y="-102.5" font-family="Droid Sans Fallback" font-size="10.00">那张表就是压缩索引。</text>
</g>
