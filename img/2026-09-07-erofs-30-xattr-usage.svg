<text text-anchor="start" x="178.5" y="-370.7" font-family="Droid Sans Fallback" font-weight="bold" font-size="11.00">security.capability</text>
<text text-anchor="start" x="274.5" y="-370.7" font-family="Droid Sans Fallback" font-size="11.00">　 = </text>
<text text-anchor="start" x="298.5" y="-370.7" font-family="Droid Sans Fallback" font-size="11.00" fill="#666666">…（能力位图）…</text>
