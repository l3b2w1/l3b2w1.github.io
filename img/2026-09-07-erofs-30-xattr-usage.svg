<text text-anchor="start" x="152.5" y="-392.7" font-family="Droid Sans Fallback" font-weight="bold" font-size="11.00">security.selinux</text>
<text text-anchor="start" x="235.5" y="-392.7" font-family="Droid Sans Fallback" font-size="11.00">　　 = u:object_r:system_lib_file:s0</text>
<text text-anchor="start" x="138" y="-381.7" font-family="Droid Sans Fallback" font-size="11.00"> &#160;&#160;&#160;&#160;&#160;&#160;&#160;</text>
