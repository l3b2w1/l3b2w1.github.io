<text text-anchor="start" x="226.5" y="-150.2" font-family="Droid Sans Fallback" font-size="11.00"> &#160;&#160;&#160;&#160;&#160;&#160;&#160;</text>
<text text-anchor="start" x="251.5" y="-150.2" font-family="Droid Sans Fallback" font-size="9.00">内核打印：</text>
<text text-anchor="start" x="199.5" y="-140.8" font-family="Droid Sans Fallback" font-size="9.00">on&#45;disk ishare xattrs not found.</text>
<text text-anchor="start" x="213.5" y="-131.8" font-family="Droid Sans Fallback" font-size="9.00">Turning off inode_share.</text>
<polygon fill="none" stroke="#ef8c00" points="187.5,-124 187.5,-262 349.5,-262 349.5,-124 187.5,-124"/>
