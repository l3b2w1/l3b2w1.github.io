<g id="node2" class="node">
<title>u1</title>
<polygon fill="#e3f2fd" stroke="transparent" points="8,-126.5 8,-259.5 153,-259.5 153,-126.5 8,-126.5"/>
<text text-anchor="start" x="14" y="-245.4" font-family="Droid Sans Fallback" font-weight="bold" font-size="12.00">① 传统用途：安全与权限</text>
<text text-anchor="start" x="26.5" y="-224.2" font-family="Droid Sans Fallback" font-size="11.00">SELinux 标签</text>
<text text-anchor="start" x="33" y="-212.2" font-family="Droid Sans Fallback" font-size="11.00">POSIX ACL</text>
<text text-anchor="start" x="30" y="-200.2" font-family="Droid Sans Fallback" font-size="11.00">capabilities</text>
<text text-anchor="start" x="13.5" y="-188.2" font-family="Droid Sans Fallback" font-size="11.00">用户自定义 user.*</text>
<text text-anchor="start" x="21.5" y="-170.8" font-family="Droid Sans Fallback" font-weight="bold" font-size="9.00" fill="#1565c0">谁在读</text>
<text text-anchor="start" x="49.5" y="-170.8" font-family="Droid Sans Fallback" font-size="9.00" fill="#1565c0">：内核 LSM / VFS、</text>
<text text-anchor="start" x="13.5" y="-161.8" font-family="Droid Sans Fallback" font-size="9.00" fill="#1565c0">getfattr(1)、Android 系统服务</text>
<text text-anchor="start" x="26.5" y="-143.8" font-family="Droid Sans Fallback" font-size="9.00">→ 只读文件系统一样需要；</text>
<text text-anchor="start" x="13.5" y="-133.8" font-family="Droid Sans Fallback" font-size="9.00">Android 重度依赖 security.selinux</text>
<polygon fill="none" stroke="#1565c0" points="8,-126.5 8,-259.5 153,-259.5 153,-126.5 8,-126.5"/>
</g>
