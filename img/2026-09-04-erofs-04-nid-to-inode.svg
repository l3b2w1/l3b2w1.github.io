<!-- why -->
<g id="node7" class="node">
<title>why</title>
<polygon fill="#fff2cc" stroke="black" points="170.54,-132.22 45.54,-132.22 45.54,-14.22 176.54,-14.22 176.54,-126.22 170.54,-132.22"/>
<polyline fill="none" stroke="black" points="170.54,-132.22 170.54,-126.22 "/>
<polyline fill="none" stroke="black" points="176.54,-126.22 170.54,-126.22 "/>
<text text-anchor="middle" x="111.04" y="-121.02" font-family="Droid Sans Fallback" font-size="9.00">为什么是「算」出来的？</text>
<text text-anchor="middle" x="111.04" y="-101.02" font-family="Droid Sans Fallback" font-size="9.00">因为 EROFS 是只读的：</text>
<text text-anchor="middle" x="111.04" y="-91.02" font-family="Droid Sans Fallback" font-size="9.00">所有布局在 mkfs 时就定死，</text>
<text text-anchor="middle" x="111.04" y="-81.02" font-family="Droid Sans Fallback" font-size="9.00">运行时不需要增删改，</text>
<text text-anchor="middle" x="111.04" y="-71.02" font-family="Droid Sans Fallback" font-size="9.00">所以不需要 B 树、位图</text>
<text text-anchor="middle" x="111.04" y="-61.02" font-family="Droid Sans Fallback" font-size="9.00">这类可变的索引结构。</text>
<text text-anchor="middle" x="111.04" y="-41.02" font-family="Droid Sans Fallback" font-size="9.00">一个乘法就能定位，</text>
<text text-anchor="middle" x="111.04" y="-31.02" font-family="Droid Sans Fallback" font-size="9.00">这是只读文件系统</text>
<text text-anchor="middle" x="111.04" y="-21.02" font-family="Droid Sans Fallback" font-size="9.00">换来的最大红利。</text>
</g>
