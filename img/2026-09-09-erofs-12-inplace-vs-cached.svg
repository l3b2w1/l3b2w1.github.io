<text text-anchor="middle" x="593" y="-699.8" font-family="Droid Sans Fallback" font-size="9.00">取舍：</text>
<text text-anchor="middle" x="593" y="-679.8" font-family="Droid Sans Fallback" font-size="9.00">in&#45;place</text>
<text text-anchor="middle" x="593" y="-669.8" font-family="Droid Sans Fallback" font-size="9.00"> &#160;✓ 少一次拷贝，快</text>
<text text-anchor="middle" x="593" y="-659.8" font-family="Droid Sans Fallback" font-size="9.00"> &#160;✗ 需要 margin 约束</text>
<text text-anchor="middle" x="593" y="-649.8" font-family="Droid Sans Fallback" font-size="9.00"> &#160;✗ 结果不缓存</text>
<text text-anchor="middle" x="593" y="-639.8" font-family="Droid Sans Fallback" font-size="9.00"> &#160;&#160;&#160;（下次读还要解压）</text>
<text text-anchor="middle" x="593" y="-619.8" font-family="Droid Sans Fallback" font-size="9.00">cached</text>
<text text-anchor="middle" x="593" y="-609.8" font-family="Droid Sans Fallback" font-size="9.00"> &#160;✓ 结果留在 managed cache</text>
<text text-anchor="middle" x="593" y="-599.8" font-family="Droid Sans Fallback" font-size="9.00"> &#160;&#160;&#160;后续读可复用</text>
<text text-anchor="middle" x="593" y="-589.8" font-family="Droid Sans Fallback" font-size="9.00"> &#160;✓ 无 margin 约束</text>
<text text-anchor="middle" x="593" y="-579.8" font-family="Droid Sans Fallback" font-size="9.00"> &#160;✗ 多一次拷贝</text>
<text text-anchor="middle" x="593" y="-559.8" font-family="Droid Sans Fallback" font-size="9.00">选择逻辑在 decompressor.c</text>
<text text-anchor="middle" x="593" y="-549.8" font-family="Droid Sans Fallback" font-size="9.00">按 pcluster 状态与</text>
<text text-anchor="middle" x="593" y="-539.8" font-family="Droid Sans Fallback" font-size="9.00">folio 可用性决定。</text>
</g>
