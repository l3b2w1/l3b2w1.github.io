<g id="node7" class="node">
<title>why</title>
<polygon fill="#f8cecc" stroke="black" points="502,-761 320,-761 320,-483 508,-483 508,-755 502,-761"/>
<polyline fill="none" stroke="black" points="502,-761 502,-755 "/>
<polyline fill="none" stroke="black" points="508,-755 502,-755 "/>
<text text-anchor="middle" x="414" y="-749" font-family="Droid Sans Fallback" font-size="10.00">⚠ 为什么 in&#45;place 需要 margin？</text>
<text text-anchor="middle" x="414" y="-726" font-family="Droid Sans Fallback" font-size="10.00">LZ4 这类算法解压时，</text>
<text text-anchor="middle" x="414" y="-715" font-family="Droid Sans Fallback" font-size="10.00">会**向前回看**已解压的数据</text>
<text text-anchor="middle" x="414" y="-704" font-family="Droid Sans Fallback" font-size="10.00">（LZ4 的回看窗口最大 64KB）。</text>
<text text-anchor="middle" x="414" y="-681" font-family="Droid Sans Fallback" font-size="10.00">如果目标内存就是源数据</text>
<text text-anchor="middle" x="414" y="-670" font-family="Droid Sans Fallback" font-size="10.00">所在的那一页：</text>
<text text-anchor="middle" x="414" y="-647" font-family="Droid Sans Fallback" font-size="10.00"> &#160;解压写指针 → &#160;████░░░░░░</text>
<text text-anchor="middle" x="414" y="-636" font-family="Droid Sans Fallback" font-size="10.00"> &#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;↑ &#160;&#160;&#160;&#160;&#160;↑</text>
<text text-anchor="middle" x="414" y="-625" font-family="Droid Sans Fallback" font-size="10.00"> &#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;已覆盖 &#160;&#160;还没覆盖</text>
<text text-anchor="middle" x="414" y="-614" font-family="Droid Sans Fallback" font-size="10.00"> &#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;（源数据在这）</text>
<text text-anchor="middle" x="414" y="-591" font-family="Droid Sans Fallback" font-size="10.00">写指针可能**追上**读指针，</text>
<text text-anchor="middle" x="414" y="-580" font-family="Droid Sans Fallback" font-size="10.00">读到自己刚写进去的错误数据。</text>
<text text-anchor="middle" x="414" y="-557" font-family="Droid Sans Fallback" font-size="10.00">解决办法：目标缓冲区尾部</text>
<text text-anchor="middle" x="414" y="-546" font-family="Droid Sans Fallback" font-size="10.00">多留一段空间（margin），</text>
<text text-anchor="middle" x="414" y="-535" font-family="Droid Sans Fallback" font-size="10.00">保证回看窗口始终读到</text>
<text text-anchor="middle" x="414" y="-524" font-family="Droid Sans Fallback" font-size="10.00">未被覆盖的原始压缩数据。</text>
<text text-anchor="middle" x="414" y="-501" font-family="Droid Sans Fallback" font-size="10.00">LZ4 的 margin = 回看窗口大小</text>
<text text-anchor="middle" x="414" y="-490" font-family="Droid Sans Fallback" font-size="10.00">（LZ4_MAX_DISTANCE_PAGES 等常量）</text>
</g>
