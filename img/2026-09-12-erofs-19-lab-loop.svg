<text text-anchor="middle" x="477" y="-713.8" font-family="Droid Sans Fallback" font-size="9.00">如何启用？</text>
<text text-anchor="middle" x="477" y="-693.8" font-family="Droid Sans Fallback" font-size="9.00">① 自行编译内核，打开</text>
<text text-anchor="middle" x="477" y="-683.8" font-family="Droid Sans Fallback" font-size="9.00"> &#160;&#160;CONFIG_EROFS_FS</text>
<text text-anchor="middle" x="477" y="-673.8" font-family="Droid Sans Fallback" font-size="9.00"> &#160;&#160;CONFIG_EROFS_FS_ZIP</text>
<text text-anchor="middle" x="477" y="-663.8" font-family="Droid Sans Fallback" font-size="9.00"> &#160;&#160;（以及各算法开关）</text>
<text text-anchor="middle" x="477" y="-643.8" font-family="Droid Sans Fallback" font-size="9.00">② 或用发行版提供的</text>
<text text-anchor="middle" x="477" y="-633.8" font-family="Droid Sans Fallback" font-size="9.00"> &#160;&#160;已启用 EROFS 的内核</text>
<text text-anchor="middle" x="477" y="-623.8" font-family="Droid Sans Fallback" font-size="9.00"> &#160;&#160;（多数现代发行版</text>
<text text-anchor="middle" x="477" y="-613.8" font-family="Droid Sans Fallback" font-size="9.00"> &#160;&#160;&#160;默认已启用）</text>
<text text-anchor="middle" x="477" y="-593.8" font-family="Droid Sans Fallback" font-size="9.00">③ 容器/沙箱场景里</text>
<text text-anchor="middle" x="477" y="-583.8" font-family="Droid Sans Fallback" font-size="9.00"> &#160;&#160;宿主机内核需要支持</text>
</g>
