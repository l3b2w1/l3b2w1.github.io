<polyline fill="none" stroke="black" points="537,-661.5 537,-655.5 "/>
<polyline fill="none" stroke="black" points="543,-655.5 537,-655.5 "/>
<text text-anchor="middle" x="462.5" y="-649.5" font-family="Droid Sans Fallback" font-size="10.00">⚠ 核心认知：内核没有 layer 抽象</text>
<text text-anchor="middle" x="462.5" y="-626.5" font-family="Droid Sans Fallback" font-size="10.00">实证：</text>
<text text-anchor="middle" x="462.5" y="-615.5" font-family="Droid Sans Fallback" font-size="10.00"> &#160;grep &#45;rin layer fs/erofs/</text>
<text text-anchor="middle" x="462.5" y="-604.5" font-family="Droid Sans Fallback" font-size="10.00"> &#160;→ **零命中**</text>
<text text-anchor="middle" x="462.5" y="-581.5" font-family="Droid Sans Fallback" font-size="10.00">内核看到的：</text>
<text text-anchor="middle" x="462.5" y="-570.5" font-family="Droid Sans Fallback" font-size="10.00"> &#160;一个扁平的设备数组</text>
<text text-anchor="middle" x="462.5" y="-559.5" font-family="Droid Sans Fallback" font-size="10.00"> &#160;（idr 树，按设备号索引）</text>
<text text-anchor="middle" x="462.5" y="-536.5" font-family="Droid Sans Fallback" font-size="10.00">内核不知道的：</text>
<text text-anchor="middle" x="462.5" y="-525.5" font-family="Droid Sans Fallback" font-size="10.00"> &#160;哪个设备是「第几层」</text>
<text text-anchor="middle" x="462.5" y="-514.5" font-family="Droid Sans Fallback" font-size="10.00"> &#160;层与层之间的依赖关系</text>
<text text-anchor="middle" x="462.5" y="-491.5" font-family="Droid Sans Fallback" font-size="10.00">⇒ 严格说，EROFS 具备的是</text>
<text text-anchor="middle" x="462.5" y="-480.5" font-family="Droid Sans Fallback" font-size="10.00"> &#160;「多设备 / 外部 blob」能力，</text>
<text text-anchor="middle" x="462.5" y="-469.5" font-family="Droid Sans Fallback" font-size="10.00"> &#160;layering 是 mkfs 在它上面</text>
<text text-anchor="middle" x="462.5" y="-458.5" font-family="Droid Sans Fallback" font-size="10.00"> &#160;构建出的用法。</text>
<text text-anchor="middle" x="462.5" y="-435.5" font-family="Droid Sans Fallback" font-size="10.00">引用时若说</text>
<text text-anchor="middle" x="462.5" y="-424.5" font-family="Droid Sans Fallback" font-size="10.00">「内核支持镜像分层」，</text>
<text text-anchor="middle" x="462.5" y="-413.5" font-family="Droid Sans Fallback" font-size="10.00">会被内核开发者纠正。</text>
</g>
