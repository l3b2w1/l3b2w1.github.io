<!-- warn -->
<g id="node14" class="node">
<title>warn</title>
<polygon fill="#fff2cc" stroke="black" points="996,-788.5 868,-788.5 868,-610.5 1002,-610.5 1002,-782.5 996,-788.5"/>
<polyline fill="none" stroke="black" points="996,-788.5 996,-782.5 "/>
<polyline fill="none" stroke="black" points="1002,-782.5 996,-782.5 "/>
<text text-anchor="middle" x="935" y="-777.3" font-family="Droid Sans Fallback" font-size="9.00">📌 为什么要有这个东西？</text>
<text text-anchor="middle" x="935" y="-757.3" font-family="Droid Sans Fallback" font-size="9.00">元数据往往横跨页边界</text>
<text text-anchor="middle" x="935" y="-747.3" font-family="Droid Sans Fallback" font-size="9.00">（比如一个 inode 在</text>
<text text-anchor="middle" x="935" y="-737.3" font-family="Droid Sans Fallback" font-size="9.00">4094 字节处，跨了两页）。</text>
<text text-anchor="middle" x="935" y="-717.3" font-family="Droid Sans Fallback" font-size="9.00">而且读元数据是高频操作</text>
<text text-anchor="middle" x="935" y="-707.3" font-family="Droid Sans Fallback" font-size="9.00">（每次查找目录都要读）。</text>
<text text-anchor="middle" x="935" y="-687.3" font-family="Droid Sans Fallback" font-size="9.00">所以需要一个</text>
<text text-anchor="middle" x="935" y="-677.3" font-family="Droid Sans Fallback" font-size="9.00">「带缓存的小游标」：</text>
<text text-anchor="middle" x="935" y="-667.3" font-family="Droid Sans Fallback" font-size="9.00">读一页、用、再读下一处，</text>
<text text-anchor="middle" x="935" y="-657.3" font-family="Droid Sans Fallback" font-size="9.00">如果还在同一页就直接复用。</text>
<text text-anchor="middle" x="935" y="-637.3" font-family="Droid Sans Fallback" font-size="9.00">代价：调用方必须记得 put。</text>
<text text-anchor="middle" x="935" y="-627.3" font-family="Droid Sans Fallback" font-size="9.00">EROFS 里已经出过</text>
<text text-anchor="middle" x="935" y="-617.3" font-family="Droid Sans Fallback" font-size="9.00">漏掉 put 的 bug。</text>
