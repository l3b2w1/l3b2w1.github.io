<g id="node9" class="node">
<title>naming</title>
<polygon fill="#fff2cc" stroke="black" points="827,-578 687,-578 687,-246 833,-246 833,-572 827,-578"/>
<polyline fill="none" stroke="black" points="827,-578 827,-572 "/>
<polyline fill="none" stroke="black" points="833,-572 827,-572 "/>
<text text-anchor="middle" x="760" y="-566" font-family="Droid Sans Fallback" font-size="10.00">📌 演讲里的三种叫法</text>
<text text-anchor="middle" x="760" y="-555" font-family="Droid Sans Fallback" font-size="10.00">其实是同一个东西：</text>
<text text-anchor="middle" x="760" y="-532" font-family="Droid Sans Fallback" font-size="10.00"> &#160;T2(2023):</text>
<text text-anchor="middle" x="760" y="-521" font-family="Droid Sans Fallback" font-size="10.00"> &#160;&#160;&quot;global compressed data</text>
<text text-anchor="middle" x="760" y="-510" font-family="Droid Sans Fallback" font-size="10.00"> &#160;&#160;&#160;deduplication by using</text>
<text text-anchor="middle" x="760" y="-499" font-family="Droid Sans Fallback" font-size="10.00"> &#160;&#160;&#160;**rolling hash**&quot;</text>
<text text-anchor="middle" x="760" y="-476" font-family="Droid Sans Fallback" font-size="10.00"> &#160;T3(2023):</text>
<text text-anchor="middle" x="760" y="-465" font-family="Droid Sans Fallback" font-size="10.00"> &#160;&#160;&quot;**variant&#45;CDC** data</text>
<text text-anchor="middle" x="760" y="-454" font-family="Droid Sans Fallback" font-size="10.00"> &#160;&#160;&#160;deduplication&quot;</text>
<text text-anchor="middle" x="760" y="-431" font-family="Droid Sans Fallback" font-size="10.00"> &#160;T4(2024):</text>
<text text-anchor="middle" x="760" y="-420" font-family="Droid Sans Fallback" font-size="10.00"> &#160;&#160;又改回</text>
<text text-anchor="middle" x="760" y="-409" font-family="Droid Sans Fallback" font-size="10.00"> &#160;&#160;&quot;**Rolling&#45;hash**</text>
<text text-anchor="middle" x="760" y="-398" font-family="Droid Sans Fallback" font-size="10.00"> &#160;&#160;&#160;compressed data</text>
<text text-anchor="middle" x="760" y="-387" font-family="Droid Sans Fallback" font-size="10.00"> &#160;&#160;&#160;deduplication&quot;</text>
<text text-anchor="middle" x="760" y="-364" font-family="Droid Sans Fallback" font-size="10.00">铁证是内核提交</text>
<text text-anchor="middle" x="760" y="-353" font-family="Droid Sans Fallback" font-size="10.00">5c2a64252c5d 的 message：</text>
<text text-anchor="middle" x="760" y="-342" font-family="Droid Sans Fallback" font-size="10.00"> &#160;&quot;variable&#45;length global</text>
<text text-anchor="middle" x="760" y="-331" font-family="Droid Sans Fallback" font-size="10.00"> &#160;&#160;compressed data</text>
<text text-anchor="middle" x="760" y="-320" font-family="Droid Sans Fallback" font-size="10.00"> &#160;&#160;deduplication with</text>
<text text-anchor="middle" x="760" y="-309" font-family="Droid Sans Fallback" font-size="10.00"> &#160;&#160;**rolling hash**&quot;</text>
<text text-anchor="middle" x="760" y="-286" font-family="Droid Sans Fallback" font-size="10.00">&quot;variant&#45;CDC&quot; 里的 CDC =</text>
<text text-anchor="middle" x="760" y="-275" font-family="Droid Sans Fallback" font-size="10.00">Content&#45;Defined Chunking，</text>
<text text-anchor="middle" x="760" y="-264" font-family="Droid Sans Fallback" font-size="10.00">本质就是用 rolling hash</text>
<text text-anchor="middle" x="760" y="-253" font-family="Droid Sans Fallback" font-size="10.00">做内容定义的变长切分。</text>
</g>
