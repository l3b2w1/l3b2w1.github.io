<g id="node10" class="node">
<title>unused</title>
<polygon fill="#f8cecc" stroke="black" points="836,-228 678,-228 678,0 842,0 842,-222 836,-228"/>
<polyline fill="none" stroke="black" points="836,-228 836,-222 "/>
<polyline fill="none" stroke="black" points="842,-222 836,-222 "/>
<text text-anchor="middle" x="760" y="-216.8" font-family="Droid Sans Fallback" font-size="9.00">⚠ 附带发现（本项目核查）：</text>
<text text-anchor="middle" x="760" y="-196.8" font-family="Droid Sans Fallback" font-size="9.00">EROFS_FEATURE_INCOMPAT_DEDUPE</text>
<text text-anchor="middle" x="760" y="-186.8" font-family="Droid Sans Fallback" font-size="9.00">（erofs_fs.h）</text>
<text text-anchor="middle" x="760" y="-166.8" font-family="Droid Sans Fallback" font-size="9.00">内核**从不查询**这个标志——</text>
<text text-anchor="middle" x="760" y="-156.8" font-family="Droid Sans Fallback" font-size="9.00">全树找不到</text>
<text text-anchor="middle" x="760" y="-146.8" font-family="Droid Sans Fallback" font-size="9.00"> erofs_sb_has_dedupe() 的</text>
<text text-anchor="middle" x="760" y="-136.8" font-family="Droid Sans Fallback" font-size="9.00">调用点。</text>
<text text-anchor="middle" x="760" y="-116.8" font-family="Droid Sans Fallback" font-size="9.00">运行时判据是</text>
<text text-anchor="middle" x="760" y="-106.8" font-family="Droid Sans Fallback" font-size="9.00">**per&#45;extent 的标志位**</text>
<text text-anchor="middle" x="760" y="-96.8" font-family="Droid Sans Fallback" font-size="9.00">（Z_EROFS_LI_PARTIAL_REF 等），</text>
<text text-anchor="middle" x="760" y="-86.8" font-family="Droid Sans Fallback" font-size="9.00">不是 superblock 的 feature 位。</text>
<text text-anchor="middle" x="760" y="-66.8" font-family="Droid Sans Fallback" font-size="9.00">⇒ 镜像不设该位、</text>
<text text-anchor="middle" x="760" y="-56.8" font-family="Droid Sans Fallback" font-size="9.00"> &#160;而 extent 带 partial 标志时，</text>
<text text-anchor="middle" x="760" y="-46.8" font-family="Droid Sans Fallback" font-size="9.00"> &#160;内核仍会走去重路径。</text>
<text text-anchor="middle" x="760" y="-26.8" font-family="Droid Sans Fallback" font-size="9.00">是否构成问题，取决于</text>
<text text-anchor="middle" x="760" y="-16.8" font-family="Droid Sans Fallback" font-size="9.00">partial&#45;ref 路径自身的</text>
<text text-anchor="middle" x="760" y="-6.8" font-family="Droid Sans Fallback" font-size="9.00">校验强度 —— **尚未评估**。</text>
</g>
