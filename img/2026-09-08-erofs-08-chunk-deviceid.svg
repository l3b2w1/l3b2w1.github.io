<g id="node7" class="node">
<title>why</title>
<polygon fill="#fff2cc" stroke="black" points="137,-627 0,-627 0,-469 143,-469 143,-621 137,-627"/>
<polyline fill="none" stroke="black" points="137,-627 137,-621 "/>
<polyline fill="none" stroke="black" points="143,-621 137,-621 "/>
<text text-anchor="middle" x="71.5" y="-615.8" font-family="Droid Sans Fallback" font-size="9.00">📌 为什么要塞进一个数里？</text>
<text text-anchor="middle" x="71.5" y="-595.8" font-family="Droid Sans Fallback" font-size="9.00">因为「逻辑偏移 → 物理位置」</text>
<text text-anchor="middle" x="71.5" y="-585.8" font-family="Droid Sans Fallback" font-size="9.00">这个映射函数的返回值</text>
<text text-anchor="middle" x="71.5" y="-575.8" font-family="Droid Sans Fallback" font-size="9.00">通常只有「地址」这一个字段。</text>
<text text-anchor="middle" x="71.5" y="-555.8" font-family="Droid Sans Fallback" font-size="9.00">多设备支持是后来加的，</text>
<text text-anchor="middle" x="71.5" y="-545.8" font-family="Droid Sans Fallback" font-size="9.00">不想改接口签名，</text>
<text text-anchor="middle" x="71.5" y="-535.8" font-family="Droid Sans Fallback" font-size="9.00">就把设备号塞进高位。</text>
<text text-anchor="middle" x="71.5" y="-515.8" font-family="Droid Sans Fallback" font-size="9.00">代价：块地址只剩 48 位。</text>
<text text-anchor="middle" x="71.5" y="-505.8" font-family="Droid Sans Fallback" font-size="9.00">好处：接口不变。</text>
<text text-anchor="middle" x="71.5" y="-485.8" font-family="Droid Sans Fallback" font-size="9.00">这是内核里常见的</text>
<text text-anchor="middle" x="71.5" y="-475.8" font-family="Droid Sans Fallback" font-size="9.00">「用位域省字段」手法。</text>
</g>
