<text text-anchor="middle" x="259.5" y="-615.8" font-family="Droid Sans Fallback" font-size="9.00">⚠ 空洞怎么表示？</text>
<text text-anchor="middle" x="259.5" y="-595.8" font-family="Droid Sans Fallback" font-size="9.00">阶段 1 见过那个离谱数字：</text>
<text text-anchor="middle" x="259.5" y="-585.8" font-family="Droid Sans Fallback" font-size="9.00"> &#160;17592186040320</text>
<text text-anchor="middle" x="259.5" y="-575.8" font-family="Droid Sans Fallback" font-size="9.00">= 0xFFFFFFFF × 4096</text>
<text text-anchor="middle" x="259.5" y="-555.8" font-family="Droid Sans Fallback" font-size="9.00">即低 48 位块地址</text>
<text text-anchor="middle" x="259.5" y="-545.8" font-family="Droid Sans Fallback" font-size="9.00">全是 1 → EROFS_NULL_ADDR</text>
<text text-anchor="middle" x="259.5" y="-525.8" font-family="Droid Sans Fallback" font-size="9.00">内核判断：</text>
<text text-anchor="middle" x="259.5" y="-515.8" font-family="Droid Sans Fallback" font-size="9.00"> &#160;if (addr ^ (EROFS_NULL_ADDR &amp; addrmask))</text>
<text text-anchor="middle" x="259.5" y="-505.8" font-family="Droid Sans Fallback" font-size="9.00"> &#160;&#160;&#160;&#160;&#160;正常地址</text>
<text text-anchor="middle" x="259.5" y="-495.8" font-family="Droid Sans Fallback" font-size="9.00"> &#160;else</text>
<text text-anchor="middle" x="259.5" y="-485.8" font-family="Droid Sans Fallback" font-size="9.00"> &#160;&#160;&#160;&#160;&#160;addr = EROFS_NULL_ADDR &#160;/* 空洞 */</text>
<text text-anchor="middle" x="259.5" y="-475.8" font-family="Droid Sans Fallback" font-size="9.00">（data.c）</text>
</g>
