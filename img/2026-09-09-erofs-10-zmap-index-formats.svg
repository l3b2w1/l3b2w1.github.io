<text text-anchor="middle" x="723" y="-773.3" font-family="Droid Sans Fallback" font-size="9.00">⚠ 易错点：</text>
<text text-anchor="middle" x="723" y="-753.3" font-family="Droid Sans Fallback" font-size="9.00">zmap.c 有这行：</text>
<text text-anchor="middle" x="723" y="-743.3" font-family="Droid Sans Fallback" font-size="9.00"> &#160;z_fragmentoff |= (u64)m.pblk &lt;&lt; 32;</text>
<text text-anchor="middle" x="723" y="-723.3" font-family="Droid Sans Fallback" font-size="9.00">看起来像「块号当字节用」的 bug，</text>
<text text-anchor="middle" x="723" y="-713.3" font-family="Droid Sans Fallback" font-size="9.00">其实是**有意的位打包**：</text>
<text text-anchor="middle" x="723" y="-693.3" font-family="Droid Sans Fallback" font-size="9.00">m.pblk 这个槽位被 mkfs 复用，</text>
<text text-anchor="middle" x="723" y="-683.3" font-family="Droid Sans Fallback" font-size="9.00">存的是 fragmentoff 的**高 32 位**。</text>
<text text-anchor="middle" x="723" y="-673.3" font-family="Droid Sans Fallback" font-size="9.00">低 32 位来自 h_fragmentoff。</text>
<text text-anchor="middle" x="723" y="-653.3" font-family="Droid Sans Fallback" font-size="9.00">合起来才是完整的 64 位偏移。</text>
<text text-anchor="middle" x="723" y="-643.3" font-family="Droid Sans Fallback" font-size="9.00">（本项目核查后确认不是 bug。）</text>
</g>
