<polyline fill="none" stroke="black" points="614,-838 614,-832 "/>
<polyline fill="none" stroke="black" points="620,-832 614,-832 "/>
<text text-anchor="middle" x="522" y="-826" font-family="Droid Sans Fallback" font-size="10.00">📌 为什么要有 HEAD / NONHEAD？</text>
<text text-anchor="middle" x="522" y="-803" font-family="Droid Sans Fallback" font-size="10.00">因为 lcluster 和 pcluster</text>
<text text-anchor="middle" x="522" y="-792" font-family="Droid Sans Fallback" font-size="10.00">**不是一一对应**的：</text>
<text text-anchor="middle" x="522" y="-769" font-family="Droid Sans Fallback" font-size="10.00"> &#160;lcluster：压缩前的固定块</text>
<text text-anchor="middle" x="522" y="-758" font-family="Droid Sans Fallback" font-size="10.00"> &#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;（通常 4K 的倍数）</text>
<text text-anchor="middle" x="522" y="-735" font-family="Droid Sans Fallback" font-size="10.00"> &#160;pcluster：一次解压的物理单位</text>
<text text-anchor="middle" x="522" y="-724" font-family="Droid Sans Fallback" font-size="10.00"> &#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;（解压后可能覆盖</text>
<text text-anchor="middle" x="522" y="-713" font-family="Droid Sans Fallback" font-size="10.00"> &#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;多个 lcluster）</text>
<text text-anchor="middle" x="522" y="-690" font-family="Droid Sans Fallback" font-size="10.00">所以从中间某个 lcluster 出发，</text>
<text text-anchor="middle" x="522" y="-679" font-family="Droid Sans Fallback" font-size="10.00">要**往回找**它所属 pcluster 的头——</text>
<text text-anchor="middle" x="522" y="-668" font-family="Droid Sans Fallback" font-size="10.00">这就是 z_erofs_extent_lookback()</text>
<text text-anchor="middle" x="522" y="-657" font-family="Droid Sans Fallback" font-size="10.00">（zmap.c）的作用。</text>
<text text-anchor="middle" x="522" y="-634" font-family="Droid Sans Fallback" font-size="10.00">代码在 zmap.c：</text>
<text text-anchor="middle" x="522" y="-623" font-family="Droid Sans Fallback" font-size="10.00"> &#160;if (不是 NONHEAD 且 偏移 &gt;= clusterofs)</text>
<text text-anchor="middle" x="522" y="-612" font-family="Droid Sans Fallback" font-size="10.00"> &#160;&#160;&#160;&#160;&#160;当前簇就是头</text>
<text text-anchor="middle" x="522" y="-601" font-family="Droid Sans Fallback" font-size="10.00"> &#160;else</text>
<text text-anchor="middle" x="522" y="-590" font-family="Droid Sans Fallback" font-size="10.00"> &#160;&#160;&#160;&#160;&#160;往回找</text>
</g>
