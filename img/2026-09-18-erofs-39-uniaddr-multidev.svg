<text text-anchor="middle" x="289" y="-64.7" font-family="Droid Sans Fallback" font-size="11.00" fill="#283593">erofs_map_dev() 做的事：判断 m_pa 落在哪个 [uniaddr, uniaddr + blocks) 区间</text>
<text text-anchor="middle" x="289" y="-52.7" font-family="Droid Sans Fallback" font-size="11.00" fill="#283593">→ 减去该设备的 uniaddr，得到设备内偏移 → m_dif 切到那个设备的后端</text>
<text text-anchor="middle" x="289" y="-27.7" font-family="Droid Sans Fallback" font-size="11.00" fill="#283593">mkfs 写进主镜像的 device table：每个额外设备的 blocks（块数）+ uniaddr（统一起始块）+ tag（sha256）。</text>
<text text-anchor="middle" x="289" y="-15.7" font-family="Droid Sans Fallback" font-size="11.00" fill="#283593">挂载时用 &#45;o device=路径 提供真实后端；数量必须与 device table 一致，否则报 extra devices don&#39;t match。</text>
