<g id="node11" class="node">
<title>why</title>
<polygon fill="#fff2cc" stroke="black" points="955.5,-896 824.5,-896 824.5,-678 961.5,-678 961.5,-890 955.5,-896"/>
<polyline fill="none" stroke="black" points="955.5,-896 955.5,-890 "/>
<polyline fill="none" stroke="black" points="961.5,-890 955.5,-890 "/>
<text text-anchor="middle" x="893" y="-884.8" font-family="Droid Sans Fallback" font-size="9.00">📌 为什么小请求同步更好？</text>
<text text-anchor="middle" x="893" y="-864.8" font-family="Droid Sans Fallback" font-size="9.00">异步要经历：</text>
<text text-anchor="middle" x="893" y="-854.8" font-family="Droid Sans Fallback" font-size="9.00"> &#160;提交工作项 → 唤醒工作线程</text>
<text text-anchor="middle" x="893" y="-844.8" font-family="Droid Sans Fallback" font-size="9.00"> &#160;→ 上下文切换 → 执行</text>
<text text-anchor="middle" x="893" y="-834.8" font-family="Droid Sans Fallback" font-size="9.00"> &#160;→ 回调/等待</text>
<text text-anchor="middle" x="893" y="-814.8" font-family="Droid Sans Fallback" font-size="9.00">对于只需解压几 KB 的请求，</text>
<text text-anchor="middle" x="893" y="-804.8" font-family="Droid Sans Fallback" font-size="9.00">这套流程的开销可能**超过**</text>
<text text-anchor="middle" x="893" y="-794.8" font-family="Droid Sans Fallback" font-size="9.00">解压本身。</text>
<text text-anchor="middle" x="893" y="-774.8" font-family="Droid Sans Fallback" font-size="9.00">所以设一个阈值：</text>
<text text-anchor="middle" x="893" y="-764.8" font-family="Droid Sans Fallback" font-size="9.00"> &#160;小于它 → 就地做</text>
<text text-anchor="middle" x="893" y="-754.8" font-family="Droid Sans Fallback" font-size="9.00"> &#160;大于它 → 排队做</text>
<text text-anchor="middle" x="893" y="-734.8" font-family="Droid Sans Fallback" font-size="9.00">这是内核里常见的</text>
<text text-anchor="middle" x="893" y="-724.8" font-family="Droid Sans Fallback" font-size="9.00">「小活自己干」模式。</text>
<text text-anchor="middle" x="893" y="-704.8" font-family="Droid Sans Fallback" font-size="9.00">12288 = 12288 字节</text>
<text text-anchor="middle" x="893" y="-694.8" font-family="Droid Sans Fallback" font-size="9.00"> &#160;&#160;&#160;&#160;&#160;= 3 × 4096</text>
<text text-anchor="middle" x="893" y="-684.8" font-family="Droid Sans Fallback" font-size="9.00"> &#160;&#160;&#160;&#160;&#160;= 3 页</text>
</g>
