<text text-anchor="start" x="41" y="-38.8" font-family="Droid Sans Fallback" font-size="9.00">容器镜像的&quot;分层&quot;是</text>
<text text-anchor="start" x="121" y="-38.8" font-family="Droid Sans Fallback" font-weight="bold" font-size="9.00">构建/分发层</text>
<text text-anchor="start" x="170" y="-38.8" font-family="Droid Sans Fallback" font-size="9.00">的语义（overlayfs 或镜像格式在处理）。</text>
<text text-anchor="start" x="142.5" y="-29.8" font-family="Droid Sans Fallback" font-size="9.00"> &#160;&#160;&#160;&#160;&#160;&#160;&#160;EROFS 内核只认：</text>
<text text-anchor="start" x="92" y="-20.8" font-family="Droid Sans Fallback" font-size="9.00">　</text>
<text text-anchor="start" x="102" y="-20.8" font-family="Droid Sans Fallback" font-weight="bold" font-size="9.00">一个文件系统 + 若干设备 + 地址指向哪个设备</text>
<text text-anchor="start" x="112" y="-11.8" font-family="Droid Sans Fallback" font-size="9.00"> &#160;&#160;&#160;&#160;&#160;&#160;&#160;它不知道也不关心&quot;这是第几层&quot;。</text>
<polygon fill="none" stroke="#c62828" points="36,-4 36,-70 340,-70 340,-4 36,-4"/>
</g>
