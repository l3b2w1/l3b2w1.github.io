<!-- why -->
<g id="node1" class="node">
<title>why</title>
<polygon fill="#e8f5e9" stroke="transparent" points="36,-596 36,-706 340,-706 340,-596 36,-596"/>
<text text-anchor="start" x="41" y="-691.6" font-family="Droid Sans Fallback" font-weight="bold" font-size="13.00">为什么要多设备：一个镜像装不下 / 想拆开 / 想复用</text>
<text text-anchor="start" x="41" y="-671.2" font-family="Droid Sans Fallback" font-weight="bold" font-size="11.00">容量</text>
<text text-anchor="start" x="64" y="-671.2" font-family="Droid Sans Fallback" font-size="11.00">　　：单个设备放不下整个镜像</text>
<text text-anchor="start" x="41" y="-651.2" font-family="Droid Sans Fallback" font-weight="bold" font-size="11.00">拆分存储</text>
<text text-anchor="start" x="87" y="-651.2" font-family="Droid Sans Fallback" font-size="11.00">：元数据放高速盘，数据放大容量盘</text>
<text text-anchor="start" x="41" y="-631.2" font-family="Droid Sans Fallback" font-weight="bold" font-size="11.00">复用</text>
<text text-anchor="start" x="64" y="-631.2" font-family="Droid Sans Fallback" font-size="11.00">　　：多个镜像共用一份&quot;基础数据&quot;，各自只带增量</text>
<text text-anchor="start" x="41" y="-612.8" font-family="Droid Sans Fallback" font-size="9.00">⇒ 挂载时用 </text>
<text text-anchor="start" x="90" y="-612.8" font-family="Droid Sans Fallback" font-weight="bold" font-size="9.00">device=</text>
<text text-anchor="start" x="124" y="-612.8" font-family="Droid Sans Fallback" font-size="9.00"> 逐个指定（可重复），</text>
<text text-anchor="start" x="47.5" y="-603.8" font-family="Droid Sans Fallback" font-size="9.00"> &#160;&#160;&#160;&#160;&#160;&#160;&#160;镜像里的地址可以指向其中任意一个</text>
<polygon fill="none" stroke="#43a047" points="36,-596 36,-706 340,-706 340,-596 36,-596"/>
</g>
