<!-- note -->
<g id="node13" class="node">
<title>note</title>
<polygon fill="#fff2cc" stroke="black" points="319,-1023.92 203,-1023.92 203,-845.92 325,-845.92 325,-1017.92 319,-1023.92"/>
<polyline fill="none" stroke="black" points="319,-1023.92 319,-1017.92 "/>
<polyline fill="none" stroke="black" points="325,-1017.92 319,-1017.92 "/>
<text text-anchor="middle" x="264" y="-1012.72" font-family="Droid Sans Fallback" font-size="9.00">📌 为什么 incompat 特性</text>
<text text-anchor="middle" x="264" y="-1002.72" font-family="Droid Sans Fallback" font-size="9.00">不匹配就要拒绝挂载？</text>
<text text-anchor="middle" x="264" y="-982.72" font-family="Droid Sans Fallback" font-size="9.00">因为不兼容特性意味着</text>
<text text-anchor="middle" x="264" y="-972.72" font-family="Droid Sans Fallback" font-size="9.00">磁盘上有本内核</text>
<text text-anchor="middle" x="264" y="-962.72" font-family="Droid Sans Fallback" font-size="9.00">读不懂的结构。</text>
<text text-anchor="middle" x="264" y="-942.72" font-family="Droid Sans Fallback" font-size="9.00">硬读会得到错误数据，</text>
<text text-anchor="middle" x="264" y="-932.72" font-family="Droid Sans Fallback" font-size="9.00">甚至触发内核异常。</text>
<text text-anchor="middle" x="264" y="-912.72" font-family="Droid Sans Fallback" font-size="9.00">宁可拒绝，不可猜。</text>
<text text-anchor="middle" x="264" y="-892.72" font-family="Droid Sans Fallback" font-size="9.00">（EROFS 官方公开声称</text>
<text text-anchor="middle" x="264" y="-882.72" font-family="Droid Sans Fallback" font-size="9.00">内核应能承受任意</text>
<text text-anchor="middle" x="264" y="-872.72" font-family="Droid Sans Fallback" font-size="9.00">磁盘损坏——这是它的</text>
<text text-anchor="middle" x="264" y="-862.72" font-family="Droid Sans Fallback" font-size="9.00">设计承诺，阶段 5 会</text>
<text text-anchor="middle" x="264" y="-852.72" font-family="Droid Sans Fallback" font-size="9.00">看到一个反例。）</text>
</g>
